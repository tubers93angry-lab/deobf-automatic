<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lua Deobfuscator</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
    textarea { width: 100%; height: 200px; background: #222; color: #0f0; border: 1px solid #444; padding: 8px; }
    button { padding: 10px 20px; background: #0a84ff; color: #fff; border: 0; cursor: pointer; margin: 10px 0; }
    pre { background: #222; padding: 10px; border: 1px solid #444; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Lua Deobfuscator</h1>

  <h3>Input (obfuscated Lua)</h3>
  <textarea id="input">local _0x1a2b = string.char(72,101,108,108,111)
local _0x3c4d = "776f726c64"
print(_0x1a2b .. " " .. "48 65 6c 6c 6f")
if false then print("dead code") end</textarea>

  <button onclick="run()">Deobfuscate</button>

  <h3>Output</h3>
  <pre id="output">(result will appear here)</pre>

  <script src="https://fengari.io/static/js/fengari-web.js"></script>
  <script>
    async function run() {
      const input = document.getElementById('input').value;
      const out = document.getElementById('output');
      out.textContent = 'Loading Lua modules...';

      try {
        // carrega todos os módulos do projeto
        const files = [
          'utils.lua',
          'lexer.lua',
          'ast.lua',
          'parser.lua',
          'passes/unhex.lua',
          'passes/constant_folding.lua',
          'passes/string_decoder.lua',
          'passes/variable_renamer.lua',
          'passes/dead_code.lua',
          'deobfuscator.lua',
        ];

        for (const f of files) {
          const res = await fetch(f);
          const code = await res.text();
          // transforma "passes/x.lua" em módulo "passes.x"
          const moduleName = f.replace(/\.lua$/, '').replace(/\//g, '.');
          fengari.load(code, '@' + f)();
          fengari.interop.js.global.__modules = fengari.interop.js.global.__modules || {};
          // registra no package.loaded
          fengari.load(`
            package.loaded['${moduleName}'] = ...
          `)(fengari.to_luastring(moduleName));
        }

        // roda o deobfuscator
        const runner = `
          local Deobf = require("deobfuscator")
          local input = ...
          local clean, err = Deobf.process(input)
          if not clean then
            return "ERROR: " .. tostring(err)
          end
          return clean
        `;
        const result = fengari.load(runner)(fengari.to_luastring(input));
        out.textContent = fengari.to_jsstring(result);
      } catch (e) {
        out.textContent = 'Error: ' + e.message;
      }
    }
  </script>
</body>
</html>
